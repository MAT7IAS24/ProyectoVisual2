name: Pulso TransMi API Sync

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

jobs:
  sync-pulso-transmi:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "httpx>=0.28,<1" "pandas>=2.2,<3" "psycopg[binary]"

      - name: Sync Pulso TransMi API data to Postgres
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          PYTHONPATH: ${{ github.workspace }}/pulso-transmi-sdk/src
        run: |
          python collect_pulso_api.py
