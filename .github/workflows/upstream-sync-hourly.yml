name: Pulso TransMi API Sync

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

jobs:
  sync-pulso-transmi:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "httpx>=0.28,<1" "pandas>=2.2,<3" "psycopg[binary]" "scikit-learn>=1.5,<2" "joblib>=1.4,<2"
          python -m pip install "git+https://github.com/uexternadojz/pulso-transmi-sdk.git"

      - name: Sync Pulso TransMi API data to Postgres
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          python collect_pulso_api.py

      - name: Select model and submit current forecast cycle
        env:
          PULSO_API_KEY: ${{ secrets.PULSO_API_KEY }}
          PULSO_API_URL: https://pulso-transmi.72-60-245-2.sslip.io
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          python run_inference.py
